name: Payment Phase 14 Cron Jobs

on:
  workflow_dispatch:
  schedule:
    # Every hour
    - cron: '0 * * * *'

jobs:
  run-payment-crons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_BASE_URL" ]; then
            echo "Missing required secret: CRON_BASE_URL"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing required secret: CRON_SECRET"
            exit 1
          fi

      - name: Trigger expire-payments cron route
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${CRON_BASE_URL%/}/api/cron/expire-payments"
          echo "Calling: $URL"
          HTTP_CODE=$(curl -sS -o /tmp/expire-payments-response.json -w "%{http_code}" \
            -H "x-cron-secret: $CRON_SECRET" \
            "$URL")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/expire-payments-response.json || true
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "expire-payments failed"
            exit 1
          fi

      - name: Trigger payment-reminders cron route
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${CRON_BASE_URL%/}/api/cron/payment-reminders"
          echo "Calling: $URL"
          HTTP_CODE=$(curl -sS -o /tmp/payment-reminders-response.json -w "%{http_code}" \
            -H "x-cron-secret: $CRON_SECRET" \
            "$URL")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/payment-reminders-response.json || true
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "payment-reminders failed"
            exit 1
          fi
